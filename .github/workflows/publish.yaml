name: "Publish Plugin"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish plugin
        run: |
          PLUGIN_VERSION="${VERSION#v}"
          if [[ ! "$PLUGIN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Release version must contain 2 to 4 numeric components." >&2
            exit 1
          fi
          IFS='.' read -r -a VERSION_PARTS <<< "$PLUGIN_VERSION"
          while (( ${#VERSION_PARTS[@]} < 4 )); do
            VERSION_PARTS+=(0)
          done
          ASSEMBLY_VERSION="$(IFS='.'; printf '%s' "${VERSION_PARTS[*]}")"
          dotnet publish Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj --configuration Release --output artifacts/publish --no-self-contained -p:Version="$PLUGIN_VERSION" -p:AssemblyVersion="$ASSEMBLY_VERSION" -p:FileVersion="$ASSEMBLY_VERSION"

      - name: Create plugin archive
        run: |
          cd artifacts/publish
          zip -r ../Jellyfin.Plugin.TagManager.zip .
          cd ../..
          md5sum artifacts/Jellyfin.Plugin.TagManager.zip | cut -d ' ' -f 1 > artifacts/checksum.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Tag Manager ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/Jellyfin.Plugin.TagManager.zip

      - name: Generate repository manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          CHECKSUM=$(cat artifacts/checksum.txt)
          jq --arg version "${VERSION#v}" \
             --arg changelog "Initial release of Tag Manager." \
             --arg targetAbi "10.9.0.0" \
             --arg sourceUrl "https://github.com/${REPOSITORY}/releases/download/${TAG}/Jellyfin.Plugin.TagManager.zip" \
             --arg checksum "${CHECKSUM^^}" \
             --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg repositoryName "$REPOSITORY" \
             --arg repositoryUrl "https://github.com/${REPOSITORY}" \
             '.[0].versions = [{version: $version, changelog: $changelog, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum, timestamp: $timestamp, repositoryName: $repositoryName, repositoryUrl: $repositoryUrl}]' \
             manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Commit repository manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Publish Tag Manager ${VERSION#v} manifest"
          git push origin HEAD:${{ github.event.repository.default_branch }}
