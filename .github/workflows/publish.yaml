name: "Publish Plugin"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.Template/Jellyfin.Plugin.Template.csproj --configuration Release --output artifacts/publish --no-self-contained

      - name: Create plugin archive
        run: |
          cd artifacts/publish
          zip -r ../Jellyfin.Plugin.TagManager.zip .
          cd ../..
          sha256sum artifacts/Jellyfin.Plugin.TagManager.zip | cut -d ' ' -f 1 > artifacts/checksum.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tag Manager ${{ env.VERSION }}
          generate_release_notes: true
          files: artifacts/Jellyfin.Plugin.TagManager.zip

      - name: Generate repository manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          CHECKSUM=$(cat artifacts/checksum.txt)
          jq --arg version "${VERSION#v}" \
             --arg targetAbi "10.9.0.0" \
             --arg sourceUrl "https://github.com/${REPOSITORY}/releases/download/${TAG}/Jellyfin.Plugin.TagManager.zip" \
             --arg checksum "$CHECKSUM" \
             '.[0].versions = [{version: $version, targetAbi: $targetAbi, sourceUrl: $sourceUrl, checksum: $checksum}]' \
             manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Commit repository manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Publish Tag Manager ${VERSION#v} manifest"
          git push origin HEAD:${{ github.event.repository.default_branch }}
