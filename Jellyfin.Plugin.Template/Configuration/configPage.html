<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tag Manager</title>
</head>
<body>
    <div id="TagManagerPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-select,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h1>Tag Manager</h1>
                <p>Search video titles or filter by an existing tag, then select existing tags or add a new tag.</p>
                <form id="TagSearchForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TagSearch">Search video titles</label>
                        <input id="TagSearch" type="search" is="emby-input" autocomplete="off">
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="TagFilter">Filter by tag</label>
                        <select id="TagFilter" is="emby-select" class="emby-select">
                            <option value="">All tags</option>
                        </select>
                    </div>
                    <button is="emby-button" type="submit" class="raised emby-button"><span>Search</span></button>
                </form>
                <div id="TagPagerTop" style="display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin-top: 1em"></div>
                <div id="TagItems" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(20em, 100%), 1fr)); gap: 1em; margin-top: 1em; max-width: 62em"></div>
                <div id="TagPager" style="display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin-top: 1em"></div>
                <p id="TagStatus" role="status"></p>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#TagManagerPage');
                var items = document.querySelector('#TagItems');
                var search = document.querySelector('#TagSearch');
                var tagFilter = document.querySelector('#TagFilter');
                var status = document.querySelector('#TagStatus');
                var availableTags = [];
                var activePlayer = null;
                var activePreviewButton = null;
                var pageSize = 100;
                var startIndex = 0;
                var currentPage = 1;
                var totalPages = 1;

                function closePreview() {
                    if (!activePlayer) {
                        return;
                    }

                    activePlayer.pause();
                    activePlayer.removeAttribute('src');
                    activePlayer.load();
                    activePlayer.remove();
                    activePlayer = null;
                    if (activePreviewButton) {
                        activePreviewButton.textContent = 'Preview';
                        activePreviewButton = null;
                    }
                }

                function url(path) {
                    return ApiClient.getUrl('Plugins/TagManager/' + path);
                }

                function loadTags() {
                    return ApiClient.getJSON(url('Tags')).then(function (tags) {
                        var selectedTag = tagFilter.value;
                        availableTags = tags;
                        tagFilter.innerHTML = '<option value="">All tags</option>';
                        availableTags.forEach(function (tag) {
                            var option = document.createElement('option');
                            option.value = tag;
                            option.textContent = tag;
                            tagFilter.appendChild(option);
                        });
                        tagFilter.value = selectedTag;
                    });
                }

                function renderItem(item) {
                    var row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.gap = '1em';
                    row.style.alignItems = 'flex-start';
                    row.style.padding = '.75em';
                    row.style.border = '1px solid rgba(127,127,127,.35)';

                    var image = document.createElement('img');
                    image.src = ApiClient.getImageUrl(item.Id, { type: 'Primary', maxWidth: 160, maxHeight: 160, quality: 80 });
                    image.alt = '';
                    image.style.width = '5em';
                    image.style.height = '7em';
                    image.style.objectFit = 'cover';
                    image.style.backgroundColor = 'rgba(127,127,127,.25)';
                    image.onerror = function () { image.style.visibility = 'hidden'; };
                    row.appendChild(image);

                    var body = document.createElement('div');
                    body.style.flex = '1 1 auto';
                    body.style.minWidth = '0';
                    var title = document.createElement('strong');
                    title.style.display = 'block';
                    title.style.overflowWrap = 'anywhere';
                    title.style.wordBreak = 'break-word';
                    title.style.lineHeight = '1.3';
                    title.textContent = item.Name;
                    body.appendChild(title);

                    var preview = document.createElement('button');
                    preview.type = 'button';
                    preview.className = 'raised emby-button';
                    preview.style.marginTop = '.75em';
                    preview.textContent = 'Preview';
                    preview.addEventListener('click', function () {
                        if (activePreviewButton === preview) {
                            closePreview();
                            return;
                        }

                        closePreview();
                        var player = document.createElement('video');
                        player.controls = true;
                        player.tabIndex = 0;
                        player.preload = 'metadata';
                        player.playsInline = true;
                        player.style.display = 'block';
                        player.style.width = '100%';
                        player.style.maxWidth = '28em';
                        player.style.marginTop = '.75em';
                        player.src = ApiClient.getUrl('Videos/' + item.Id + '/stream.mp4?api_key=' + encodeURIComponent(ApiClient.accessToken()));
                        player.addEventListener('error', function () {
                            status.textContent = 'Unable to play this video in the browser.';
                        });
                        body.insertBefore(player, tags);
                        activePlayer = player;
                        activePreviewButton = preview;
                        preview.textContent = 'Close preview';
                        player.focus();
                        player.play().catch(function () { });
                    });
                    body.appendChild(preview);

                    var tags = document.createElement('div');
                    tags.style.marginTop = '.5em';
                    var tagPrompt = document.createElement('div');
                    tagPrompt.textContent = 'Select tags for this video:';
                    tagPrompt.style.marginBottom = '.5em';
                    tags.appendChild(tagPrompt);
                    var tagChoices = document.createElement('div');
                    tagChoices.style.display = 'flex';
                    tagChoices.style.flexWrap = 'wrap';
                    tagChoices.style.gap = '.5em';
                    var currentTags = (item.Tags || []).slice();
                    var selectedTags = currentTags.slice();
                    var tagInputs = [];

                    function hasTag(tagList, tag) {
                        return tagList.some(function (existingTag) {
                            return existingTag.toLowerCase() === tag.toLowerCase();
                        });
                    }

                    availableTags.forEach(function (tag) {
                        var label = document.createElement('label');
                        label.style.display = 'inline-flex';
                        label.style.alignItems = 'center';
                        label.style.gap = '.35em';
                        label.style.padding = '.25em .5em';
                        label.style.border = '1px solid rgba(127,127,127,.45)';
                        label.style.borderRadius = '.25em';

                        var checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.value = tag;
                        checkbox.checked = hasTag(currentTags, tag);
                        tagInputs.push(checkbox);
                        label.appendChild(checkbox);
                        label.appendChild(document.createTextNode(tag));
                        tagChoices.appendChild(label);
                    });
                    tags.appendChild(tagChoices);

                    var apply = document.createElement('button');
                    apply.type = 'button';
                    apply.className = 'raised button-submit emby-button';
                    apply.style.marginTop = '.5em';
                    apply.textContent = 'Apply selected tags';
                    apply.disabled = true;
                    function updateApplyState() {
                        apply.disabled = selectedTags.length === currentTags.length
                            && selectedTags.every(function (tag) { return hasTag(currentTags, tag); });
                    }
                    tagInputs.forEach(function (checkbox) {
                        checkbox.addEventListener('change', function () {
                            selectedTags = tagInputs.filter(function (input) { return input.checked; })
                                .map(function (input) { return input.value; });
                            updateApplyState();
                        });
                    });
                    apply.addEventListener('click', function () {
                        var requests = [];
                        selectedTags.filter(function (tag) { return !hasTag(currentTags, tag); }).forEach(function (tag) {
                            requests.push(function () {
                                return ApiClient.ajax({
                                    type: 'POST',
                                    url: url('Items/' + item.Id + '/Tags'),
                                    data: JSON.stringify({ Tag: tag }),
                                    contentType: 'application/json'
                                });
                            });
                        });
                        currentTags.filter(function (tag) { return !hasTag(selectedTags, tag); }).forEach(function (tag) {
                            requests.push(function () {
                                return ApiClient.ajax({
                                    type: 'DELETE',
                                    url: url('Items/' + item.Id + '/Tags?tag=' + encodeURIComponent(tag))
                                });
                            });
                        });

                        apply.disabled = true;
                        tagInputs.forEach(function (checkbox) { checkbox.disabled = true; });
                        status.textContent = 'Saving tags...';
                        requests.reduce(function (promise, request) {
                            return promise.then(request);
                        }, Promise.resolve())
                            .then(function () {
                                status.textContent = 'Tags saved.';
                                return loadTags().then(function () { return refreshItems(false); });
                            })
                            .catch(function (error) {
                                tagInputs.forEach(function (checkbox) { checkbox.disabled = false; });
                                updateApplyState();
                                showTagSaveError(error);
                            });
                    });
                    tags.appendChild(apply);

                    var addTagForm = document.createElement('form');
                    addTagForm.style.display = 'flex';
                    addTagForm.style.flexWrap = 'wrap';
                    addTagForm.style.alignItems = 'flex-end';
                    addTagForm.style.gap = '.5em';
                    addTagForm.style.marginTop = '.75em';

                    var addTagInputContainer = document.createElement('div');
                    addTagInputContainer.className = 'inputContainer';
                    addTagInputContainer.style.flex = '1 1 12em';
                    addTagInputContainer.style.margin = '0';
                    var addTagInputId = 'NewTag-' + item.Id;
                    var addTagLabel = document.createElement('label');
                    addTagLabel.className = 'inputLabel inputLabelUnfocused';
                    addTagLabel.htmlFor = addTagInputId;
                    addTagLabel.textContent = 'New tag for this video';
                    var addTagInput = document.createElement('input');
                    addTagInput.id = addTagInputId;
                    addTagInput.type = 'text';
                    addTagInput.className = 'emby-input';
                    addTagInput.autocomplete = 'off';
                    addTagInputContainer.appendChild(addTagLabel);
                    addTagInputContainer.appendChild(addTagInput);
                    addTagForm.appendChild(addTagInputContainer);

                    var add = document.createElement('button');
                    add.type = 'submit';
                    add.className = 'raised button-submit emby-button';
                    add.textContent = 'Add tag';
                    addTagForm.appendChild(add);
                    addTagForm.addEventListener('submit', function (event) {
                        event.preventDefault();
                        var value = addTagInput.value.trim();
                        if (!value) {
                            status.textContent = 'Enter a tag first.';
                            return;
                        }
                        add.disabled = true;
                        ApiClient.ajax({
                            type: 'POST',
                            url: url('Items/' + item.Id + '/Tags'),
                            data: JSON.stringify({ Tag: value }),
                            contentType: 'application/json'
                        }).then(function () {
                            addTagInput.value = '';
                            status.textContent = 'Tag saved.';
                            return loadTags().then(function () { return refreshItems(false); });
                        }).catch(function (error) {
                            add.disabled = false;
                            showTagSaveError(error);
                        });
                    });
                    tags.appendChild(addTagForm);
                    body.appendChild(tags);
                    row.appendChild(body);
                    items.appendChild(row);
                }

                function loadItems(append, requestedStartIndex, requestedLimit) {
                    var queryStartIndex = requestedStartIndex === undefined ? startIndex : requestedStartIndex;
                    var queryLimit = requestedLimit === undefined ? pageSize : requestedLimit;
                    var query = 'Items?search=' + encodeURIComponent(search.value || '')
                        + '&tag=' + encodeURIComponent(tagFilter.value || '')
                        + '&startIndex=' + queryStartIndex
                        + '&limit=' + queryLimit;
                    return ApiClient.getJSON(url(query)).then(function (result) {
                        if (!append) {
                            closePreview();
                            items.innerHTML = '';
                        }
                        result.Items.forEach(renderItem);
                        totalPages = Math.max(1, Math.ceil(result.TotalCount / pageSize));
                        renderPager();
                        status.textContent = result.TotalCount + ' video(s)';
                    });
                }

                function createPageButton(label, pageNumber, isCurrent) {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = isCurrent ? 'raised button-submit emby-button' : 'raised emby-button';
                    button.textContent = label;
                    button.disabled = isCurrent || pageNumber === currentPage;
                    button.addEventListener('click', function () {
                        currentPage = pageNumber;
                        startIndex = (currentPage - 1) * pageSize;
                        loadItems(false).catch(showLoadError);
                    });
                    return button;
                }

                function renderPager() {
                    ['#TagPagerTop', '#TagPager'].forEach(function (selector) {
                        var pager = document.querySelector(selector);
                        pager.innerHTML = '';
                        if (totalPages <= 1) {
                            return;
                        }

                        pager.appendChild(createPageButton('First', 1, currentPage === 1));
                        pager.appendChild(createPageButton('Previous', Math.max(1, currentPage - 1), false));
                        var firstVisiblePage = Math.max(1, currentPage - 2);
                        var lastVisiblePage = Math.min(totalPages, currentPage + 2);
                        for (var pageNumber = firstVisiblePage; pageNumber <= lastVisiblePage; pageNumber++) {
                            pager.appendChild(createPageButton(String(pageNumber), pageNumber, pageNumber === currentPage));
                        }
                        pager.appendChild(createPageButton('Next', Math.min(totalPages, currentPage + 1), false));
                        pager.appendChild(createPageButton('Last', totalPages, currentPage === totalPages));
                    });
                }

                function refreshItems(resetPage) {
                    if (resetPage) {
                        startIndex = 0;
                        currentPage = 1;
                    }
                    return loadItems(false);
                }

                function showLoadError(error) {
                    console.error('Tag Manager failed to load', error);
                    status.textContent = 'Unable to load videos. Check the Jellyfin server log.';
                }

                function showTagSaveError(error) {
                    console.error('Tag Manager failed to save tags', error);
                    status.textContent = 'Unable to save tags. Check the Jellyfin server log.';
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.hideLoadingMsg();
                    status.textContent = 'Loading videos...';
                    loadTags().then(function () { return refreshItems(true); }).catch(showLoadError);
                });

                page.addEventListener('pagehide', closePreview);

                document.querySelector('#TagSearchForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    refreshItems(true).catch(showLoadError);
                });

            }());
        </script>
    </div>
</body>
</html>
