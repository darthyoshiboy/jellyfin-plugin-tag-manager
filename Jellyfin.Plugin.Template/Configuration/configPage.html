<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tag Manager</title>
</head>
<body>
    <div id="TagManagerPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h1>Tag Manager</h1>
                <p>Search your library, then add or remove tags. Previously used tags appear as suggestions.</p>
                <form id="TagSearchForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TagSearch">Search library</label>
                        <input id="TagSearch" type="search" is="emby-input" autocomplete="off" />
                    </div>
                    <button is="emby-button" type="submit" class="raised emby-button">
                        <span>Search</span>
                    </button>
                </form>
                <div class="inputContainer" style="margin-top: 2em">
                    <label class="inputLabel inputLabelUnfocused" for="TagName">New or existing tag</label>
                    <input id="TagName" list="UsedTags" type="text" is="emby-input" autocomplete="off" />
                    <datalist id="UsedTags"></datalist>
                </div>
                <div id="TagItems" style="margin-top: 1em"></div>
                <p id="TagStatus" role="status"></p>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#TagManagerPage');
                var items = document.querySelector('#TagItems');
                var search = document.querySelector('#TagSearch');
                var tagName = document.querySelector('#TagName');
                var usedTags = document.querySelector('#UsedTags');
                var status = document.querySelector('#TagStatus');

                function url(path) {
                    return ApiClient.getUrl('Plugins/TagManager/' + path);
                }

                function loadTags() {
                    return ApiClient.getJSON(url('Tags')).then(function (tags) {
                        usedTags.innerHTML = '';
                        tags.forEach(function (tag) {
                            var option = document.createElement('option');
                            option.value = tag;
                            usedTags.appendChild(option);
                        });
                    });
                }

                function loadItems() {
                    return ApiClient.getJSON(url('Items?search=' + encodeURIComponent(search.value || ''))).then(function (libraryItems) {
                        items.innerHTML = '';
                        libraryItems.forEach(function (item) {
                            var row = document.createElement('div');
                            row.style.marginBottom = '1em';
                            var title = document.createElement('strong');
                            title.textContent = item.Name;
                            row.appendChild(title);
                            var tags = document.createElement('div');
                            tags.style.marginTop = '.35em';
                            item.Tags.forEach(function (tag) {
                                var remove = document.createElement('button');
                                remove.type = 'button';
                                remove.className = 'raised emby-button';
                                remove.style.marginRight = '.5em';
                                remove.textContent = tag + '  x';
                                remove.addEventListener('click', function () {
                                    ApiClient.ajax({ type: 'DELETE', url: url('Items/' + item.Id + '/Tags?tag=' + encodeURIComponent(tag)) })
                                        .then(function () { loadTags().then(loadItems); });
                                });
                                tags.appendChild(remove);
                            });
                            var add = document.createElement('button');
                            add.type = 'button';
                            add.className = 'raised button-submit emby-button';
                            add.textContent = 'Add tag';
                            add.addEventListener('click', function () {
                                var value = tagName.value.trim();
                                if (!value) {
                                    status.textContent = 'Enter a tag first.';
                                    return;
                                }
                                ApiClient.ajax({
                                    type: 'POST',
                                    url: url('Items/' + item.Id + '/Tags'),
                                    data: JSON.stringify({ Tag: value }),
                                    contentType: 'application/json'
                                }).then(function () {
                                    status.textContent = 'Tag saved.';
                                    loadTags().then(loadItems);
                                });
                            });
                            tags.appendChild(add);
                            row.appendChild(tags);
                            items.appendChild(row);
                        });
                    });
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    Promise.all([loadTags(), loadItems()]).then(function () { Dashboard.hideLoadingMsg(); });
                });

                document.querySelector('#TagSearchForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    loadItems();
                });
            }());
        </script>
    </div>
</body>
</html>
