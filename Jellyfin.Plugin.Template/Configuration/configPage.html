<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tag Manager</title>
</head>
<body>
    <div id="TagManagerPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <h1>Tag Manager</h1>
                <p>Search videos, then add or remove tags. Previously used tags appear as suggestions.</p>
                <form id="TagSearchForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="TagSearch">Search videos</label>
                        <input id="TagSearch" type="search" is="emby-input" autocomplete="off">
                    </div>
                    <button is="emby-button" type="submit" class="raised emby-button"><span>Search</span></button>
                </form>
                <div class="inputContainer" style="margin-top: 2em">
                    <label class="inputLabel inputLabelUnfocused" for="TagName">New or existing tag</label>
                    <input id="TagName" list="UsedTags" type="text" is="emby-input" autocomplete="off">
                    <datalist id="UsedTags"></datalist>
                </div>
                <div id="TagItems" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(20em, 1fr)); gap: 1em; margin-top: 1em"></div>
                <div id="TagPager" style="display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin-top: 1em"></div>
                <p id="TagStatus" role="status"></p>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#TagManagerPage');
                var items = document.querySelector('#TagItems');
                var search = document.querySelector('#TagSearch');
                var tagName = document.querySelector('#TagName');
                var usedTags = document.querySelector('#UsedTags');
                var status = document.querySelector('#TagStatus');
                var pageSize = 100;
                var startIndex = 0;
                var currentPage = 1;
                var totalPages = 1;

                function url(path) {
                    return ApiClient.getUrl('Plugins/TagManager/' + path);
                }

                function loadTags() {
                    return ApiClient.getJSON(url('Tags')).then(function (tags) {
                        usedTags.innerHTML = '';
                        tags.forEach(function (tag) {
                            var option = document.createElement('option');
                            option.value = tag;
                            usedTags.appendChild(option);
                        });
                    });
                }

                function renderItem(item) {
                    var row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.gap = '1em';
                    row.style.alignItems = 'flex-start';
                    row.style.padding = '.75em';
                    row.style.border = '1px solid rgba(127,127,127,.35)';

                    var image = document.createElement('img');
                    image.src = ApiClient.getImageUrl(item.Id, { type: 'Primary', maxWidth: 160, maxHeight: 160, quality: 80 });
                    image.alt = '';
                    image.style.width = '5em';
                    image.style.height = '7em';
                    image.style.objectFit = 'cover';
                    image.style.backgroundColor = 'rgba(127,127,127,.25)';
                    image.onerror = function () { image.style.visibility = 'hidden'; };
                    row.appendChild(image);

                    var body = document.createElement('div');
                    body.style.flex = '1 1 auto';
                    body.style.minWidth = '0';
                    var title = document.createElement('strong');
                    title.style.display = 'block';
                    title.style.overflowWrap = 'anywhere';
                    title.style.wordBreak = 'break-word';
                    title.style.lineHeight = '1.3';
                    title.textContent = item.Name;
                    body.appendChild(title);

                    var preview = document.createElement('button');
                    preview.type = 'button';
                    preview.className = 'raised emby-button';
                    preview.style.marginTop = '.75em';
                    preview.textContent = 'Preview';
                    preview.addEventListener('click', function () {
                        var existingPlayer = body.querySelector('video');
                        if (existingPlayer) {
                            existingPlayer.pause();
                            existingPlayer.remove();
                            preview.textContent = 'Preview';
                            return;
                        }

                        var player = document.createElement('video');
                        player.controls = true;
                        player.preload = 'metadata';
                        player.playsInline = true;
                        player.style.display = 'block';
                        player.style.width = '100%';
                        player.style.maxWidth = '28em';
                        player.style.marginTop = '.75em';
                        player.src = ApiClient.getUrl('Videos/' + item.Id + '/stream.mp4?api_key=' + encodeURIComponent(ApiClient.accessToken()));
                        player.addEventListener('error', function () {
                            status.textContent = 'Unable to play this video in the browser.';
                        });
                        body.insertBefore(player, tags);
                        preview.textContent = 'Close preview';
                        player.play().catch(function () { });
                    });
                    body.appendChild(preview);

                    var tags = document.createElement('div');
                    tags.style.marginTop = '.5em';
                    (item.Tags || []).forEach(function (tag) {
                        var remove = document.createElement('button');
                        remove.type = 'button';
                        remove.className = 'raised emby-button';
                        remove.style.marginRight = '.5em';
                        remove.style.marginBottom = '.5em';
                        remove.textContent = tag + '  x';
                        remove.addEventListener('click', function () {
                            ApiClient.ajax({ type: 'DELETE', url: url('Items/' + item.Id + '/Tags?tag=' + encodeURIComponent(tag)) })
                                .then(function () { refreshItems(false); loadTags(); });
                        });
                        tags.appendChild(remove);
                    });

                    var add = document.createElement('button');
                    add.type = 'button';
                    add.className = 'raised button-submit emby-button';
                    add.textContent = 'Add tag';
                    add.addEventListener('click', function () {
                        var value = tagName.value.trim();
                        if (!value) {
                            status.textContent = 'Enter a tag first.';
                            return;
                        }
                        ApiClient.ajax({
                            type: 'POST',
                            url: url('Items/' + item.Id + '/Tags'),
                            data: JSON.stringify({ Tag: value }),
                            contentType: 'application/json'
                        }).then(function () {
                            status.textContent = 'Tag saved.';
                            refreshItems(false);
                            loadTags();
                        });
                    });
                    tags.appendChild(add);
                    body.appendChild(tags);
                    row.appendChild(body);
                    items.appendChild(row);
                }

                function loadItems(append, requestedStartIndex, requestedLimit) {
                    var queryStartIndex = requestedStartIndex === undefined ? startIndex : requestedStartIndex;
                    var queryLimit = requestedLimit === undefined ? pageSize : requestedLimit;
                    var query = 'Items?search=' + encodeURIComponent(search.value || '') + '&startIndex=' + queryStartIndex + '&limit=' + queryLimit;
                    return ApiClient.getJSON(url(query)).then(function (result) {
                        if (!append) {
                            items.innerHTML = '';
                        }
                        result.Items.forEach(renderItem);
                        totalPages = Math.max(1, Math.ceil(result.TotalCount / pageSize));
                        renderPager();
                        status.textContent = result.TotalCount + ' video(s)';
                    });
                }

                function createPageButton(label, pageNumber, isCurrent) {
                    var button = document.createElement('button');
                    button.type = 'button';
                    button.className = isCurrent ? 'raised button-submit emby-button' : 'raised emby-button';
                    button.textContent = label;
                    button.disabled = isCurrent || pageNumber === currentPage;
                    button.addEventListener('click', function () {
                        currentPage = pageNumber;
                        startIndex = (currentPage - 1) * pageSize;
                        loadItems(false).catch(showLoadError);
                    });
                    return button;
                }

                function renderPager() {
                    var pager = document.querySelector('#TagPager');
                    pager.innerHTML = '';
                    if (totalPages <= 1) {
                        return;
                    }

                    pager.appendChild(createPageButton('First', 1, currentPage === 1));
                    pager.appendChild(createPageButton('Previous', Math.max(1, currentPage - 1), false));
                    var firstVisiblePage = Math.max(1, currentPage - 2);
                    var lastVisiblePage = Math.min(totalPages, currentPage + 2);
                    for (var pageNumber = firstVisiblePage; pageNumber <= lastVisiblePage; pageNumber++) {
                        pager.appendChild(createPageButton(String(pageNumber), pageNumber, pageNumber === currentPage));
                    }
                    pager.appendChild(createPageButton('Next', Math.min(totalPages, currentPage + 1), false));
                    pager.appendChild(createPageButton('Last', totalPages, currentPage === totalPages));
                }

                function refreshItems(resetPage) {
                    if (resetPage) {
                        startIndex = 0;
                        currentPage = 1;
                    }
                    return loadItems(false);
                }

                function showLoadError(error) {
                    console.error('Tag Manager failed to load', error);
                    status.textContent = 'Unable to load videos. Check the Jellyfin server log.';
                }

                page.addEventListener('pageshow', function () {
                    Dashboard.hideLoadingMsg();
                    status.textContent = 'Loading videos...';
                    Promise.all([loadTags(), refreshItems(true)]).catch(showLoadError);
                });

                document.querySelector('#TagSearchForm').addEventListener('submit', function (event) {
                    event.preventDefault();
                    refreshItems(true).catch(showLoadError);
                });

            }());
        </script>
    </div>
</body>
</html>
